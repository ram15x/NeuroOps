version: '3.8'

services:

  # ── PostgreSQL ─────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: neuroops_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: neuroops123
      POSTGRES_DB: neuroops_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: neuroops_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: neuroops_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:neuroops123@postgres:5432/neuroops_db
      REDIS_URL: redis://redis:6379
    volumes:
      - .:/app
      - ./ml_models:/app/ml_models
      - ./datasets:/app/datasets
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: