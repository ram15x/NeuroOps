name: NeuroOps CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: neuroops_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create .env file
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5433/neuroops_db" > backend/.env
          echo "SECRET_KEY=ci_test_secret_key_neuroops" >> backend/.env
          echo "ALGORITHM=HS256" >> backend/.env
          echo "ACCESS_TOKEN_EXPIRE_MINUTES=30" >> backend/.env

      - name: Create dummy model files
        run: |
          python - <<EOF
          import joblib
          import numpy as np
          from sklearn.ensemble import IsolationForest, RandomForestClassifier, RandomForestRegressor, GradientBoostingRegressor
          from sklearn.preprocessing import StandardScaler
          import os

          os.makedirs("ml_models/saved", exist_ok=True)

          # inframind model
          X = np.random.randn(100, 4)
          iso = IsolationForest(random_state=42)
          iso.fit(X)
          joblib.dump(iso, "ml_models/saved/inframind_model.pkl")
          joblib.dump(StandardScaler().fit(X), "ml_models/saved/inframind_scaler.pkl")

          # failure classifier
          X2 = np.random.randn(100, 24)
          y2 = np.random.randint(0, 2, 100)
          rf = RandomForestClassifier(random_state=42)
          rf.fit(X2, y2)
          joblib.dump(rf, "ml_models/saved/failure_model.pkl")
          joblib.dump(StandardScaler().fit(X2), "ml_models/saved/failure_scaler.pkl")

          # RUL model a
          y3 = np.random.randint(0, 125, 100)
          rr = RandomForestRegressor(random_state=42)
          rr.fit(X2, y3)
          joblib.dump(rr, "ml_models/saved/failure_rul_model.pkl")
          joblib.dump(StandardScaler().fit(X2), "ml_models/saved/failure_rul_scaler.pkl")

          # RUL model b
          gb = GradientBoostingRegressor(random_state=42)
          gb.fit(X2, y3)
          joblib.dump(gb, "ml_models/saved/failure_rul_model_b.pkl")
          joblib.dump(StandardScaler().fit(X2), "ml_models/saved/failure_rul_scaler_b.pkl")

          print("dummy models created")
          EOF

      - name: Start FastAPI server
        run: |
          uvicorn backend.main:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: Health check - root endpoint
        run: |
          curl -f http://localhost:8000/ | python -m json.tool

      - name: Health check - docs available
        run: |
          curl -f http://localhost:8000/docs -o /dev/null -w "%{http_code}" | grep 200

      - name: Test InfraMind predict endpoint
        run: |
          curl -f -X POST http://localhost:8000/api/v1/inframind/predict \
            -H "Content-Type: application/json" \
            -d '{"metric":"ec2_cpu","value":95.5,"rolling_mean":45.2,"rolling_std":5.1,"value_diff":50.3}' \
            | python -m json.tool

      - name: Test failure predict endpoint
        run: |
          curl -f -X POST http://localhost:8000/api/v1/failure/predict \
            -H "Content-Type: application/json" \
            -d '{"unit_id":"ci_test","sensor1":518.67,"sensor2":642.46,"sensor3":1583.25,"sensor4":1407.91,"sensor5":14.62,"sensor6":21.61,"sensor7":553.69,"sensor8":2388.09,"sensor9":9050.17,"sensor10":1.3,"sensor11":47.28,"sensor12":521.72,"sensor13":2388.09,"sensor14":8138.62,"sensor15":8.42,"sensor16":0.03,"sensor17":392.0,"sensor18":2388.0,"sensor19":100.0,"sensor20":38.86,"sensor21":23.36,"sensor22":0.0,"sensor23":0.0,"sensor24":0.0}' \
            | python -m json.tool

      - name: CI passed
        run: echo "All NeuroOps health checks passed"